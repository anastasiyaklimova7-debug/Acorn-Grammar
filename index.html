  color-scheme: light;
}

#app {
  position: relative; z-index: 1;
  height: 100%;
  box-sizing: border-box;
  padding-inline: 16px;
  padding-block: 12px;
  display: flex; flex-direction: column; gap: 8px;
}

/* ---------- HUD ---------- */
.hud { display: flex; justify-content: flex-start; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--paper); border: 3px solid var(--bark); border-radius: 999px;
  padding: 4px 14px; font-size: 1.05rem; line-height: 1.2;
  box-shadow: 0 3px 0 var(--bark);
}
.dots { display: flex; gap: 5px; align-items: center; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bark); background: transparent; box-sizing: border-box; }
.dot.now { transform: scale(1.35); background: #fff; }
.dot.first { background: var(--gold); }
.dot.retry { background: #e6b9a0; }
.count { font-variant-numeric: tabular-nums; }
.mini { width: 24px; height: 24px; flex: none; }
.hud-right { display: flex; gap: 8px; align-items: center; }
.sound { cursor: pointer; }
.sound:hover { background: #fff; }

/* ---------- Acorns ---------- */
.play {
  flex: 1; min-height: 0;
  display: flex; align-items: center; justify-content: center;
  gap: clamp(6px, 5vw, 110px);
}
.acorn {
  position: relative; flex: none;
  width: var(--aw); aspect-ratio: 414 / 420;
  padding: 0; border: 0; background: none; cursor: pointer;
  border-radius: 50%;
  filter: drop-shadow(0 10px 6px rgba(91, 52, 22, .35));
  animation: bob var(--dur, 2.6s) ease-in-out var(--delay, 0s) infinite alternate;
  -webkit-tap-highlight-color: transparent;
}
.acorn:focus-visible { outline: 4px solid var(--ink); outline-offset: 4px; }
.acorn .inner { position: absolute; inset: 0; transition: transform .2s ease; }
.acorn:hover:not(:disabled) .inner { transform: scale(1.08); }
.acorn .art { position: absolute; inset: 0; }
.acorn .label {
  position: absolute; left: 50%; top: 69%;
  transform: translate(-50%, -50%);
  font-size: calc(var(--aw) * .27);
  line-height: 1;
  color: var(--ink);
  text-shadow: 0 1px 0 rgba(255, 238, 205, .9), 0 0 8px rgba(255, 220, 160, .7);
  white-space: nowrap;
  pointer-events: none;
}
.acorn.enter .inner { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: var(--enter, 0s); }
.acorn.shake .inner { animation: shake .45s ease; }
.acorn.wrong { opacity: .4; filter: grayscale(.6) drop-shadow(0 6px 4px rgba(91, 52, 22, .2)); cursor: default; }
.acorn.right .inner { animation: celebrate .7s ease both; }
.acorn.dim { opacity: .35; cursor: default; }
.acorn.right {
  filter: brightness(1.18) saturate(1.15) drop-shadow(0 0 10px #fff) drop-shadow(0 0 22px #fff3b0) drop-shadow(0 0 40px rgba(255, 240, 160, .9));
}
.acorn.right .label { color: #000; text-shadow: none; }

.spark {
  position: absolute; left: 50%; top: 50%;
  color: #fff; font-size: 1.4rem; line-height: 1;
  text-shadow: 0 0 5px #b45309, 0 0 2px #b45309;
  pointer-events: none;
  animation: spark .85s ease-out forwards;
}

@keyframes bob {
  from { transform: translateY(calc(var(--amp) * -1)) rotate(-4deg); }
  to   { transform: translateY(var(--amp)) rotate(4deg); }
}
@keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-12px) rotate(-6deg); }
  40% { transform: translateX(10px) rotate(5deg); }
  60% { transform: translateX(-7px) rotate(-3deg); }
  80% { transform: translateX(4px); }
}
@keyframes celebrate {
  0% { transform: scale(1); }
  35% { transform: scale(1.3) rotate(-6deg); }
  70% { transform: scale(1.15) rotate(5deg); }
  100% { transform: scale(1.2); }
}
@keyframes spark {
  from { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
  to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3); opacity: 0; }
}

/* ---------- Board ---------- */
.board {
  width: 100%; max-width: 1180px; align-self: center; box-sizing: border-box;
  background: var(--paper);
  border: 4px solid var(--bark); border-radius: 26px;
  padding: 14px 20px 16px;
  box-shadow: 0 6px 0 var(--bark), 0 16px 30px rgba(60, 30, 5, .28);
  display: grid; gap: 8px; text-align: center;
}
.sentence {
  margin: 0;
  font-size: clamp(1.7rem, min(5.4vw, 7.6vh), 3.8rem);
  line-height: 1.3;
  text-wrap: balance;
}
.gap {
  display: inline-block; min-width: 1.6em; text-align: center;
  border-bottom: .09em dashed var(--bark);
  margin-inline: .06em;
  color: var(--leaf);
}
.gap.filled { border-bottom-style: solid; border-bottom-color: var(--leaf); animation: gapPop .5s cubic-bezier(.3, 1.6, .5, 1); }
.gap:not(.filled) { animation: blink 1.6s ease-in-out infinite; }
@keyframes gapPop { from { transform: scale(.4); } to { transform: scale(1); } }
@keyframes blink { 50% { border-bottom-color: rgba(91, 52, 22, .35); } }

.bar { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 2.6rem; }
.msg { margin: 0; font-size: 1.3rem; }
.msg.good { color: var(--leaf-deep); }
.msg.bad { color: var(--bad); }

.btn {
  cursor: pointer;
  background: var(--leaf); color: #fff;
  border: 0; border-radius: 999px;
  padding: .55em 1.6em;
  font-size: 1.2rem;
  box-shadow: 0 4px 0 var(--leaf-deep);
}
.btn:hover { background: #38913c; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--leaf-deep); }
.btn:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
.sound:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

/* ---------- Overlay ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 5;
  display: grid; place-items: center;
  padding: 16px; box-sizing: border-box;
  background: rgba(255, 233, 170, .55);
}
.overlay[hidden] { display: none; }
.card {
  width: min(100%, 460px); box-sizing: border-box;
  background: var(--paper);
  border: 4px solid var(--bark); border-radius: 28px;
  padding: 22px 22px 26px;
  box-shadow: 0 6px 0 var(--bark), 0 18px 40px rgba(60, 30, 5, .3);
  text-align: center; display: grid; gap: 12px; justify-items: center;
}
.card h1 { margin: 0; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.1; }
.card p { margin: 0; font-size: 1.2rem; line-height: 1.35; }
.hero { width: 110px; aspect-ratio: 414 / 420; animation: bob 1.4s ease-in-out infinite alternate; --amp: 10px; }
.chips { display: flex; gap: 10px; }
.chip { background: #fff; border: 3px solid var(--bark); border-radius: 14px; padding: 2px 14px; font-size: 1.6rem; }

@media (max-width: 640px) {
  .sentence { min-height: 2.7em; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; }
  .board { padding-inline: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .acorn, .hero { animation: none; }
  .gap:not(.filled) { animation: none; }
}
</style>

    b.type = "button"; b.className = "acorn";
    b.style.setProperty("--dur", DURS[i]); b.style.setProperty("--delay", DELAYS[i]);
    b.innerHTML = '<span class="inner"><span class="art"></span><span class="label"></span></span>';
    b.addEventListener("click", onPick);
    playEl.appendChild(b); acorns.push(b);
  }

  function buildDots() {
    dotsEl.innerHTML = "";
    for (var i = 0; i < SENTENCES.length; i++) { var d = document.createElement("span"); d.className = "dot"; dotsEl.appendChild(d); }
  }
  function paintDots() {
    var d = dotsEl.children;
    for (var i = 0; i < d.length; i++) {
      d[i].className = "dot" + (results[i] === 1 ? " first" : results[i] === 0 ? " retry" : "") + (i === idx ? " now" : "");
    }
  }

  function render() {
    var s = SENTENCES[order[idx]];
    sentenceEl.innerHTML = "";
    sentenceEl.appendChild(document.createTextNode(s.pre));
    var gap = document.createElement("span"); gap.className = "gap"; gap.id = "gap"; gap.innerHTML = "&nbsp;";
    sentenceEl.appendChild(gap);
    sentenceEl.appendChild(document.createTextNode(s.post));
    msgEl.textContent = "Pick the right acorn!"; msgEl.className = "msg";
    nextBtn.hidden = true;
    nextBtn.textContent = idx === SENTENCES.length - 1 ? "Finish" : "Next";
    countEl.textContent = (idx + 1) + " / " + SENTENCES.length;
    scoreEl.textContent = score;
    firstTry = true; locked = false;
    var forms = shuffle(FORMS);
    acorns.forEach(function (a, i) {
      a.className = "acorn";
      a.disabled = false;
      a.dataset.form = forms[i];
      a.setAttribute("aria-label", s.pre + forms[i] + s.post);
      a.querySelector(".label").textContent = forms[i];
      a.style.setProperty("--enter", (i * 0.09) + "s");
      void a.offsetWidth;
      a.classList.add("enter");
    });
    paintDots();
  }

  function onPick(e) {
    var btn = e.currentTarget;
    if (locked || btn.disabled) return;
    initAudio();
    var s = SENTENCES[order[idx]];
    if (btn.dataset.form === s.ans) {
      locked = true;
      var gap = $("gap"); gap.textContent = s.ans; gap.classList.add("filled");
      acorns.forEach(function (a) { a.classList.remove("enter", "shake"); if (a !== btn) a.classList.add("dim"); });
      btn.classList.add("right"); burst(btn);
      if (firstTry) score++;
      results[idx] = firstTry ? 1 : 0;
      scoreEl.textContent = score;
      msgEl.textContent = GOOD[Math.floor(Math.random() * GOOD.length)]; msgEl.className = "msg good";
      nextBtn.hidden = false; nextBtn.focus({ preventScroll: true });
      paintDots(); sndRight();
    } else {
      firstTry = false;
      btn.classList.remove("enter", "shake"); void btn.offsetWidth;
      btn.classList.add("shake", "wrong"); btn.disabled = true;
      msgEl.textContent = "Try again!"; msgEl.className = "msg bad";
      sndWrong();
    }
  }

  nextBtn.addEventListener("click", function () {
    if (idx < SENTENCES.length - 1) { idx++; render(); }
    else {
      $("result").textContent = "First try: " + score + " of " + SENTENCES.length + " acorns.";
      $("end").hidden = false; sndEnd();
      $("again").focus({ preventScroll: true });
    }
  });

  function start() {
    order = shuffle(SENTENCES.map(function (_, i) { return i; }));
    idx = 0; score = 0; results = [];
    buildDots(); render();
  }
  $("again").addEventListener("click", function () { initAudio(); $("end").hidden = true; start(); });

  start();
})();
</script>

</body></html>
